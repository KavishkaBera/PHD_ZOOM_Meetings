<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Scheduler</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --bg: #f5f6fa;
            --text: #2f3640;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h2, h3 {
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="datetime-local"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            padding: 10px;
            border-radius: 4px;
        }
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .schedule-item {
            background: var(--bg);
            padding: 15px;
            border-left: 4px solid var(--accent);
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .schedule-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
        }
        .schedule-meta {
            font-size: 14px;
            color: #7f8fa6;
            margin: 5px 0;
        }
        .tag {
            display: inline-block;
            background: #dcdde1;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 5px;
            margin-top: 5px;
        }
        #statusMessage {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #27ae60;
            display: none;
        }
    </style>
</head>
<body>

    <h2>Proposal Meeting Scheduler</h2>

    <div class="card">
        <h3>Create New Schedule</h3>
        <div class="form-group">
            <label for="meetingTitle">Meeting Topic</label>
            <input type="text" id="meetingTitle" placeholder="e.g., Project Proposal Clarifications" value="Project Proposal Clarifications">
        </div>
        
        <div class="form-group">
            <label for="meetingTime">Proposed Time</label>
            <input type="datetime-local" id="meetingTime">
        </div>

        <div class="form-group">
            <label>Required Attendees:</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="prof1" value="Prof. R.S. Rajakuruna" checked>
                    <label for="prof1" style="margin:0;">Prof. R.S. Rajakuruna</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="prof2" value="Prof. U.A. Jayawardena" checked>
                    <label for="prof2" style="margin:0;">Prof. U.A. Jayawardena</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="prof3" value="Prof. N. Jayasena" checked>
                    <label for="prof3" style="margin:0;">Prof. N. Jayasena</label>
                </div>
            </div>
        </div>

        <button id="saveBtn" onclick="saveSchedule()">Save to Dashboard & GitHub</button>
        <div id="statusMessage">Syncing with GitHub...</div>
    </div>

    <div class="card">
        <h3>Past Schedules</h3>
        <div id="scheduleList">
            <p style="color: #7f8fa6;">Loading schedules from GitHub...</p>
        </div>
    </div>

    <script>
        // ==========================================
        // GITHUB CONFIGURATION - UPDATE THESE 3 LINES
        // ==========================================
        const GITHUB_TOKEN = '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'; 
        const REPO_OWNER = 'KavishkaBera';
        const REPO_NAME = 'PHD_ZOOM_Meetings';
        const FILE_PATH = 'data/schedules.json';

        // Local array to hold the data
        let schedules = [];

        // Fetch data from GitHub when the page loads
        window.onload = async function() {
            await fetchFromGitHub();
        };

        // Fetch the file from GitHub
        async function fetchFromGitHub() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    // GitHub returns file content in Base64 encoding. We decode it here.
                    const decodedContent = decodeURIComponent(escape(atob(data.content)));
                    schedules = JSON.parse(decodedContent);
                    
                    // Store the file's SHA hash, which GitHub requires to update the file later
                    sessionStorage.setItem('fileSha', data.sha); 
                    renderSchedules();
                } else if (response.status === 404) {
                    // File doesn't exist yet, that's fine.
                    console.log("No existing file found on GitHub. Starting fresh.");
                    renderSchedules();
                } else {
                    console.error("GitHub API Error:", response.status, response.statusText);
                    document.getElementById('scheduleList').innerHTML = '<p style="color: #e74c3c;">Failed to load data. Check console for details or verify your Token/Repo details.</p>';
                }
            } catch (error) {
                console.error("Error fetching from GitHub:", error);
                document.getElementById('scheduleList').innerHTML = '<p style="color: #e74c3c;">Network error occurred while fetching data.</p>';
            }
        }

        // Handle saving a new schedule
        async function saveSchedule() {
            const title = document.getElementById('meetingTitle').value;
            const time = document.getElementById('meetingTime').value;
            const saveBtn = document.getElementById('saveBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            const attendees = [];
            if(document.getElementById('prof1').checked) attendees.push("Prof. R.S. Rajakuruna");
            if(document.getElementById('prof2').checked) attendees.push("Prof. U.A. Jayawardena");
            if(document.getElementById('prof3').checked) attendees.push("Prof. N. Jayasena");

            if(!title || !time || attendees.length === 0) {
                alert("Please fill out all fields and select at least one attendee.");
                return;
            }

            // UI Feedback during save
            saveBtn.disabled = true;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#f39c12';
            statusMsg.innerText = 'Syncing with GitHub...';

            const newMeeting = {
                id: Date.now(),
                title: title,
                time: new Date(time).toLocaleString(),
                attendees: attendees
            };

            schedules.unshift(newMeeting); // Add to beginning of array
            
            // Render locally immediately
            renderSchedules();
            
            // Push to GitHub
            await syncWithGitHub(schedules);
            
            // Reset UI
            document.getElementById('meetingTime').value = '';
            saveBtn.disabled = false;
            
            // Success Feedback
            statusMsg.style.color = '#27ae60';
            statusMsg.innerText = 'Successfully saved to GitHub!';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
        }

        // Render the list of schedules
        function renderSchedules() {
            const list = document.getElementById('scheduleList');
            list.innerHTML = '';

            if(schedules.length === 0) {
                list.innerHTML = '<p style="color: #7f8fa6;">No schedules found.</p>';
                return;
            }

            schedules.forEach(meeting => {
                const item = document.createElement('div');
                item.className = 'schedule-item';
                
                const tags = meeting.attendees.map(a => `<span class="tag">${a}</span>`).join('');
                
                item.innerHTML = `
                    <div class="schedule-title">${meeting.title}</div>
                    <div class="schedule-meta">Proposed Time: ${meeting.time}</div>
                    <div>${tags}</div>
                `;
                list.appendChild(item);
            });
        }

        // Push updates to GitHub
        async function syncWithGitHub(scheduleData) {
            // Encode to Base64 (handling special characters safely)
            const content = btoa(unescape(encodeURIComponent(JSON.stringify(scheduleData, null, 2)))); 
            const sha = sessionStorage.getItem('fileSha');

            const bodyData = {
                message: 'Updated meeting schedules via Web App',
                content: content,
                branch: 'main'
            };
            
            // Include the SHA if the file already exists to overwrite it
            if (sha) bodyData.sha = sha;

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (response.ok) {
                    const result = await response.json();
                    // Update our stored SHA to the new file's SHA
                    sessionStorage.setItem('fileSha', result.content.sha);
                    console.log("Successfully synced with GitHub!");
                } else {
                    console.error("Failed to push to GitHub:", response.statusText);
                    alert("Failed to save to GitHub. Check the console for details.");
                }
            } catch (error) {
                console.error("Network error during push:", error);
                alert("Network error. Failed to save to GitHub.");
            }
        }
    </script>
</body>
</html>
